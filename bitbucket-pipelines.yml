image: atlassian/default-image:3

options:
  size: 2x
definitions:
  services:
    docker:
      memory: 5120

pipelines:
  branches:
    develop:
      - step:
          name: Build and Test
          script:
            - echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin
            - docker build --no-cache --rm -f Dockerfile -t aiaracorp1/storebar-admin-backend:latest .
            - docker push aiaracorp1/storebar-admin-backend:latest
          services:
            - docker
          caches:
            - docker

      - step:
          name: Deploy to Production
          deployment: Production
          script:
            - chmod 400 aiaracorp.pem
            - ssh-keyscan $AIARA_IP >> ~/.ssh/known_hosts
            - scp -i aiaracorp.pem -r ./kubernetes/* aiara@$AIARA_IP:/home/aiara/service/storebar/admin
            - ssh -i aiaracorp.pem aiara@$AIARA_IP "sh -f service/storebar/admin/storebar-admin.sh"
            - echo 'DONE DEPLOY LIVE'
          services:
            - docker
          when: on_success

      - step:
          name: Send Slack Notification - Deploy End
          script:
            - echo "Send Slack Notification with CURL - Deploy End"
            - curl --location "https://slack.aiaracorp.com/api/v1/deploy" --header "Content-Type:application/json" --data '{"name":"STOREBAR-ADMIN-BACKEND","code":"STOREBAR-ADMIN","message":"STOREBAR-ADMIN-BACKEND 배포가 완료되었습니다."}'
